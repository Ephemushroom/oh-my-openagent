name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  block-master-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Check PR target branch
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$BASE_REF" != "master" ]; then
            echo "PR targets '${BASE_REF}' branch - OK"
            exit 0
          fi

          echo "::error::PRs to master branch are not allowed. Please target the 'dev' branch instead."
          gh pr comment "$PR_URL" --body "Hi @${PR_AUTHOR}, this repository accepts pull requests against dev, not master. Please retarget or recreate this PR against dev."
          gh pr close "$PR_URL"
          exit 1

      - name: Write job summary
        if: always()
        env:
          JOB_SUMMARY_STATUS: ${{ job.status }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf '## PR target guard\n\nResult: `%s`\nTarget: `%s`\n' "$JOB_SUMMARY_STATUS" "$BASE_REF" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    # The fork runs the complete suite serially rather than upstream's OS shards.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build test prerequisites
        run: bun run build

      - name: Verify generated schema artifacts are committed
        run: |
          if ! git diff --exit-code -- assets/oh-my-opencode.schema.json assets/omo.schema.json; then
            echo "Regenerate schemas with: bun run build:schema && bun run build:omo-schema"
            exit 1
          fi

      - name: Remove stale self-package test copies
        run: bun run script/remove-stale-self-package-tests.ts

      - name: Run tests
        run: bun test --timeout 20000

      - name: Write job summary
        if: always()
        env:
          JOB_SUMMARY_TITLE: Root test suite (Linux)
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: Builds prerequisites and runs the root Bun suite serially on Linux.
          JOB_SUMMARY_NEXT: Inspect the first failing build or test.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: bun run typecheck

      - name: Write job summary
        if: always()
        env:
          JOB_SUMMARY_TITLE: TypeScript checks (Linux)
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: Runs root, script, and package TypeScript checks.
          JOB_SUMMARY_NEXT: Inspect the first TypeScript diagnostic.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
